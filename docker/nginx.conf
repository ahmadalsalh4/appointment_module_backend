server {
    listen ${PORT};
    root /var/www/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Sanctum bearer auth must reach PHP. Some base images omit
        # HTTP_AUTHORIZATION from fastcgi_params, so we pass it
        # explicitly here.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # Internal artisan bridge can run for minutes during a heavy
        # migrate, queue:work --once, or cache:clear. Default 60s is
        # too tight.
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
